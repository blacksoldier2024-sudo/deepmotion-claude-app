name: Build APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Generate Gradle wrapper
        run: gradle wrapper --gradle-version 8.7

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK as build artifact
        uses: actions/upload-artifact@v4
        with:
          name: leather-punch-app
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Publish APK as a GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: "نسخه ${{ github.run_number }}"
          files: app/build/outputs/apk/debug/app-debug.apk
          body: |
            نسخه‌ی خودکارساخته‌شده از آخرین کد اپ.
            برای نصب، فایل app-debug.apk رو از پایین همین صفحه دانلود کنید.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
